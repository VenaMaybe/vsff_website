<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PDF Review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script type="module" src="{{ url_for('static', filename='review/menus.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static',filename='styles/dialogs.css') }}">
  <script type="module" src="{{ url_for('static',filename='review/management.js') }}"></script>
</head>
<body>
  <header class="site-header app-toolbar">
    <a class="brand" href="{{ url_for('core.dashboard') }}">PDF Review</a>
    <span class="slice-label">Private beta</span>
    {% include "_account_menu.html" %}
  </header>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages" aria-live="polite">
          {% for category, message in messages %}
            <p class="message {{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

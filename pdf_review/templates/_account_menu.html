{% if auth_user %}
<details class="toolbar-menu identity-menu">
  <summary title="{{ auth_user.display_name }}" aria-haspopup="menu">{{ auth_user.display_name }}</summary>
  <div class="toolbar-popover" role="menu" aria-label="Account">
    <div class="menu-metadata"><strong>{{ auth_user.display_name }}</strong><span>{{ auth_user.email }}</span></div>
    <hr>
    <a role="menuitem" href="{{ url_for('accounts.account') }}">Account</a>
    {% if can_invite_beta %}<a role="menuitem" href="{{ url_for('invites.manage') }}">Invitations</a><a role="menuitem" href="{{ url_for('invites.members') }}">Beta members</a>{% endif %}
    <a role="menuitem" href="{{ url_for('legal.privacy') }}">Privacy policy</a>
    <a role="menuitem" href="{{ url_for('legal.terms') }}">Terms of service</a>
    {% if is_site_admin %}<a role="menuitem" href="{{ url_for('accounts.admin') }}">Admin</a>{% endif %}
    <hr>
    <form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button role="menuitem" type="submit">Log out</button></form>
  </div>
</details>
{% endif %}

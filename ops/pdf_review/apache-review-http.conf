# Bootstrap only: enable this BEFORE requesting the separate review certificate.
# After TLS is validated, replace with the HTTP redirect below the TLS template.
<VirtualHost *:80>
    ServerName review.venasff.com
    ProxyRequests Off
    ProxyPreserveHost On

    # Only public ACME challenge files live here; never put application data here.
    DocumentRoot /var/www/vsff-review-acme
    <Directory /var/www/vsff-review-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    # Only ACME and health are available during bootstrap. No HTTP sign-in/PDFs.
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "http"
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{REQUEST_URI} !^/healthz$
    RewriteRule ^ - [R=503,L]
    ProxyPass /healthz http://127.0.0.1:8002/healthz connectiontimeout=5 timeout=120
    ProxyPassReverse /healthz http://127.0.0.1:8002/healthz

    # Suppress request logs here: OAuth query strings can contain transient codes.
    # Existing site logs/configuration are not changed.
    CustomLog /dev/null common
    ErrorLog ${APACHE_LOG_DIR}/vsff-review-error.log
    LogLevel warn
</VirtualHost>
